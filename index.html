        ];

        const grid = document.getElementById('rosterGrid');
        const modal = document.getElementById('playerModal');
        const iframe = document.getElementById('modalIframe');
        const closeBtn = document.getElementById('closeModal');

        // Génération dynamique des éléments HTML
        joueurs.forEach(j => {
            const card = document.createElement('div');
            card.className = `player-card cat-${j.cat}`;
            card.innerHTML = `
                <div class="player-number">#${j.id < 10 ? '0' + j.id : j.id}</div>
                <h3 class="player-name">${j.nom}</h3>
                <div class="player-position">${j.poste}</div>
                <div class="player-club">${j.club}</div>
                <button class="view-btn" onclick="openFlyer('flyers/${j.fichier}')">Voir la Fiche TikTok</button>
            `;
            grid.appendChild(card);
        });

        // Fonctions d'affichage de la modale
        function openFlyer(url) {
            iframe.src = url;
            modal.classList.add('active');
        }

        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            iframe.src = "";
        });

        modal.addEventListener('click', (e) => {
            if(e.target === modal) {
                modal.classList.remove('active');
                iframe.src = "";
            }
        });
    </script>
</body>
</html>
